campaign: "Diwali 2025"
brand: nalanda

# Buy-X-Get-Y scheme
headline: "Buy 2 Get 1 FREE this Diwali!"
sub: "Celebrate with the best deals on electronics"
kick: "Limited Period Offer"
badge: "DIWALI SPECIAL"
chips:
  - "Buy 2, Get 1 Free"
  - "All Categories"
  - "While Stocks Last"
stamp_line1: "Valid till"
stamp_line2: "Diwali Night"

